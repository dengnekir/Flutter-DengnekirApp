name: Vistopia
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^3.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "image/logo.png"

flutter:
  uses-material-design: true

  assets:
    - image/
    - fonts/

  fonts:
    - family: Margarine
      fonts:
        - asset: fonts/Margarine-Regular.ttf
          weight: 300
    - family: Rowdies
      fonts:
        - asset: fonts/Rowdies-Regular.ttf
          weight: 300
